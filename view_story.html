<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Story - {{ owner['name'] }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="story-viewer">
    <a href="/" class="close-btn" style="color:white; text-decoration:none;">✕</a>
    <div class="story-progress">
        {% for s in stories %}<div class="seg done"></div>{% endfor %}
    </div>

    {% if stories %}
        {% for s in stories %}
            {% if s['type'] == 'video' %}
                <video src="{{ s['media_url'] }}" autoplay controls oncontextmenu="return false" ondragstart="return false"></video>
            {% else %}
                <img src="{{ s['media_url'] }}" oncontextmenu="return false" ondragstart="return false" ondblclick="return false">
            {% endif %}
        {% endfor %}
        <p style="color:white; margin-top:12px; font-size:13px;">{{ owner['name'] }}'s story</p>
    {% else %}
        <p style="color:white;">No active stories.</p>
    {% endif %}
</div>

</body>
</html>
