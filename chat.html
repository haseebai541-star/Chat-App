<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Room</title>
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#075e54">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #e5ddd5; height: 100vh; display: flex; flex-direction: column; }

    .header {
        background: #075e54;
        color: white;
        padding: 14px 20px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }
    .header h2 { font-size: 17px; }
    .header button {
        background: #128c7e;
        color: white;
        border: none;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
        font-size: 13px;
    }

    #messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .msg {
        max-width: 70%;
        padding: 10px 14px;
        border-radius: 10px;
        background: white;
        box-shadow: 0 1px 2px rgba(0,0,0,0.15);
        font-size: 14px;
        word-wrap: break-word;
    }
    .msg.me { align-self: flex-end; background: #dcf8c6; }
    .msg .sender { font-size: 11px; color: #075e54; font-weight: 600; margin-bottom: 3px; }
    .msg img, .msg video { max-width: 220px; border-radius: 8px; margin-top: 4px; display: block; }
    .msg audio { margin-top: 4px; }
    .status-msg { text-align: center; color: #777; font-size: 12px; margin: 6px 0; }

    .input-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 14px;
        background: #f0f0f0;
        border-top: 1px solid #ddd;
    }
    .input-bar input[type="text"] {
        flex: 1;
        padding: 12px 16px;
        border: none;
        border-radius: 24px;
        outline: none;
        font-size: 14px;
    }
    .icon-btn {
        background: none;
        border: none;
        font-size: 22px;
        cursor: pointer;
        padding: 6px;
    }
    .send-btn {
        background: #25d366;
        border: none;
        color: white;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 18px;
    }
    .icon-btn.recording { color: red; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

    #shareBox {
        display: none;
        background: #fff3cd;
        padding: 10px 14px;
        font-size: 13px;
        text-align: center;
    }
    #shareBox a { color: #075e54; font-weight: 600; }
</style>
</head>
<body>

<div class="header">
    <h2>💬 Chat Room</h2>
    <button onclick="copyLink()">Link Copy Karein</button>
</div>

<div id="shareBox">Ye link doosre insaan ko bhejein taake wo isi chat mein aa sake ✅ (copy ho gaya)</div>

<div id="messages"></div>

<div class="input-bar">
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="file" id="fileInput" style="display:none" onchange="sendFile(this.files[0])">
    <input type="text" id="textInput" placeholder="Message likhein..." onkeypress="if(event.key==='Enter') sendText()">
    <button class="icon-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
    <button class="send-btn" onclick="sendText()">➤</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const roomId = "{{ room_id }}";
const username = "User-" + Math.floor(Math.random() * 1000);
const socket = io();
const messagesDiv = document.getElementById("messages");

socket.on("connect", () => {
    socket.emit("join", { room: roomId, username });
});

socket.on("status", (data) => {
    const div = document.createElement("div");
    div.className = "status-msg";
    div.textContent = data.msg;
    messagesDiv.appendChild(div);
    scrollDown();
});

socket.on("receive_message", (data) => {
    addMessageToUI(data, data.username === username);
});

function addMessageToUI(data, isMe) {
    const div = document.createElement("div");
    div.className = "msg" + (isMe ? " me" : "");

    let inner = `<div class="sender">${isMe ? "Aap" : data.username}</div>`;

    if (data.type === "text") {
        inner += `<div>${escapeHtml(data.content)}</div>`;
    } else if (data.type === "image") {
        inner += `<img src="${data.content}">`;
    } else if (data.type === "video") {
        inner += `<video src="${data.content}" controls></video>`;
    } else if (data.type === "audio") {
        inner += `<audio src="${data.content}" controls></audio>`;
    } else if (data.type === "file") {
        inner += `<a href="${data.content}" target="_blank">📄 ${data.filename}</a>`;
    }

    div.innerHTML = inner;
    messagesDiv.appendChild(div);
    scrollDown();
}

function escapeHtml(text) {
    const d = document.createElement("div");
    d.textContent = text;
    return d.innerHTML;
}

function scrollDown() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function sendText() {
    const input = document.getElementById("textInput");
    const text = input.value.trim();
    if (!text) return;
    socket.emit("send_message", { room: roomId, username, type: "text", content: text });
    input.value = "";
}

async function sendFile(file) {
    if (!file) return;
    const formData = new FormData();
    formData.append("file", file);

    const res = await fetch(`/upload/${roomId}`, { method: "POST", body: formData });
    const data = await res.json();

    let type = "file";
    if (file.type.startsWith("image/")) type = "image";
    else if (file.type.startsWith("video/")) type = "video";
    else if (file.type.startsWith("audio/")) type = "audio";

    socket.emit("send_message", {
        room: roomId, username, type, content: data.url, filename: data.filename
    });
    document.getElementById("fileInput").value = "";
}

// Voice note recording
let mediaRecorder;
let audioChunks = [];
let isRecording = false;

async function toggleRecording() {
    const micBtn = document.getElementById("micBtn");

    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];

            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                const file = new File([blob], "voice_note.webm", { type: "audio/webm" });
                await sendFile(file);
            };

            mediaRecorder.start();
            isRecording = true;
            micBtn.textContent = "⏹️";
            micBtn.classList.add("recording");
        } catch (err) {
            alert("Microphone access nahi mila: " + err.message);
        }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.textContent = "🎤";
        micBtn.classList.remove("recording");
    }
}

function copyLink() {
    const link = window.location.href;
    navigator.clipboard.writeText(link);
    const box = document.getElementById("shareBox");
    box.style.display = "block";
    setTimeout(() => box.style.display = "none", 4000);
}
</script>

</body>
</html>
