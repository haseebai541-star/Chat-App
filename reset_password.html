<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - NovaChat</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand-mark">NC</div>
        <h1>Enter Code</h1>
        <p class="sub">Enter the 6-digit code we emailed you, and choose a new password.</p>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" value="{{ email }}" required>
            </div>
            <div class="field">
                <label>Verification Code</label>
                <input type="text" name="otp" maxlength="6" pattern="[0-9]{6}" required placeholder="6-digit code">
            </div>
            <div class="field">
                <label>New Password</label>
                <input type="password" name="new_password" required minlength="6">
            </div>
            <button class="btn-primary" type="submit">Reset Password</button>
        </form>

        <div class="switch-link"><a href="/login">&larr; Back to Log In</a></div>
    </div>
</div>
</body>
</html>
