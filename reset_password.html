<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Set New Password</h1>
        <p class="sub">Choose a new password for your account.</p>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

        {% if not invalid %}
        <form method="POST">
            <div class="field">
                <label>New Password</label>
                <div style="position:relative;">
                    <input type="password" name="password" id="pw" required minlength="6" style="padding-right:44px;">
                    <button type="button" onclick="togglePw()" style="position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:16px;">👁</button>
                </div>
            </div>
            <button class="btn-primary" type="submit">Update Password</button>
        </form>
        {% else %}
        <div class="switch-link"><a href="/forgot-password">Request a new link</a></div>
        {% endif %}
    </div>
</div>
<script>
function togglePw() {
    const pw = document.getElementById('pw');
    pw.type = pw.type === 'password' ? 'text' : 'password';
}
</script>
</body>
</html>
