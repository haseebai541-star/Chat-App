<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In - NovaChat</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand-mark">NC</div>
        <h1>Welcome Back</h1>
        <p class="sub">Log in to continue chatting.</p>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required autocomplete="email">
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <div class="forgot-link"><a href="/forgot-password">Forgot password?</a></div>
            <button class="btn-primary" type="submit">Log In</button>
        </form>

        <div class="switch-link">Don't have an account? <a href="/signup">Sign Up</a></div>
    </div>
</div>
</body>
</html>
