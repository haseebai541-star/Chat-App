<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat with {{ other['name'] }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="chat-header">
    <a class="back" href="/">←</a>
    {% if other['profile_pic'] %}
        <img class="avatar" src="/media/profiles/{{ other['profile_pic'] }}">
    {% else %}
        <div class="avatar">{{ other['name'][0]|upper }}</div>
    {% endif %}
    <div class="info">
        <div class="name">{{ other['name'] }}</div>
        <div class="id-tag">ID: {{ other['id'] }}</div>
        <div class="status" id="peerStatus">{% if is_online %}Online{% else %}Offline{% endif %}</div>
    </div>
</div>

<div id="messages">
    {% for m in messages %}
        {% include "_message_partial.html" %}
    {% endfor %}
</div>

<div class="typing-indicator" id="typingIndicator" style="display:none;">{{ other['name'] }} is typing...</div>

<div class="chat-input-bar">
    <button class="icon-btn" onclick="document.getElementById('fileInput').click()">📎</button>
    <input type="file" id="fileInput" style="display:none" onchange="sendFile(this.files[0])">
    <input type="text" id="textInput" placeholder="Message" onkeypress="if(event.key==='Enter') sendText()" oninput="handleTyping()">
    <button class="icon-btn" id="micBtn" onclick="toggleRecording()">🎤</button>
    <button class="send-btn" onclick="sendText()">➤</button>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script>
const room = "{{ room }}";
const myId = "{{ user['id'] }}";
const otherId = "{{ other['id'] }}";
const socket = io();
const messagesDiv = document.getElementById("messages");

socket.on("connect", () => {
    socket.emit("join", { room });
    socket.emit("mark_seen", { room });
});

socket.on("presence", (data) => {
    if (data.user_id === otherId) {
        document.getElementById("peerStatus").textContent = data.online ? "Online" : "Offline";
    }
});

socket.on("typing", (data) => {
    if (data.user_id === otherId) document.getElementById("typingIndicator").style.display = "block";
});
socket.on("stop_typing", (data) => {
    if (data.user_id === otherId) document.getElementById("typingIndicator").style.display = "none";
});

socket.on("receive_message", (msg) => {
    addMessageToDOM(msg);
    if (msg.sender_id !== myId) socket.emit("mark_seen", { room });
});

socket.on("messages_seen", () => {
    document.querySelectorAll(".msg-row.me .ticks").forEach(el => el.classList.add("seen"));
});

socket.on("message_deleted", (data) => {
    const el = document.getElementById("msg-" + data.message_id);
    if (el) el.remove();
});

socket.on("view_once_consumed", (data) => {
    const el = document.getElementById("vo-" + data.message_id);
    if (el) el.innerHTML = "<em style='font-size:12px;color:#888;'>Photo opened</em>";
});

function addMessageToDOM(msg) {
    const isMe = msg.sender_id === myId;
    const row = document.createElement("div");
    row.className = "msg-row " + (isMe ? "me" : "them");
    row.id = "msg-" + msg.id;

    let inner = `<div class="bubble">`;
    if (isMe) inner += `<button class="delete-btn" onclick="deleteMessage(${msg.id})">✕</button>`;

    if (msg.type === "text") {
        inner += `<div>${escapeHtml(msg.content)}</div>`;
    } else if (msg.type === "image" && msg.view_once) {
        inner += `<div id="vo-${msg.id}"><div class="view-once-badge" onclick="openViewOnce(${msg.id}, '${msg.content}')">📷 View Once Photo (tap to open)</div></div>`;
    } else if (msg.type === "image") {
        inner += `<img src="${msg.content}" oncontextmenu="return false" ondragstart="return false" ondblclick="return false">`;
    } else if (msg.type === "video") {
        inner += `<video src="${msg.content}" controls oncontextmenu="return false"></video>`;
    } else if (msg.type === "audio") {
        inner += `<audio src="${msg.content}" controls></audio>`;
    } else if (msg.type === "file") {
        inner += `<a href="${msg.content}" target="_blank">📄 ${msg.filename}</a>`;
    }

    const time = new Date(msg.timestamp + "Z").toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    inner += `<div class="meta">${time}`;
    if (isMe) inner += ` <span class="ticks ${msg.seen ? 'seen' : ''}">✓✓</span>`;
    inner += `</div></div>`;

    row.innerHTML = inner;
    messagesDiv.appendChild(row);
    window.scrollTo(0, document.body.scrollHeight);
}

function openViewOnce(msgId, url) {
    const container = document.getElementById("vo-" + msgId);
    container.innerHTML = `<img src="${url}" style="max-width:220px;border-radius:8px;">`;
    socket.emit("view_once_opened", { message_id: msgId, room });
    setTimeout(() => {
        container.innerHTML = "<em style='font-size:12px;color:#888;'>Photo opened</em>";
    }, 8000);
}

function deleteMessage(msgId) {
    if (!confirm("Delete this message for everyone? This cannot be undone.")) return;
    socket.emit("delete_message", { message_id: msgId, room });
}

function escapeHtml(text) {
    const d = document.createElement("div");
    d.textContent = text;
    return d.innerHTML;
}

function sendText() {
    const input = document.getElementById("textInput");
    const text = input.value.trim();
    if (!text) return;
    socket.emit("send_message", { room, receiver_id: otherId, type: "text", content: text });
    input.value = "";
    socket.emit("stop_typing", { room });
}

let typingTimeout;
function handleTyping() {
    socket.emit("typing", { room });
    clearTimeout(typingTimeout);
    typingTimeout = setTimeout(() => socket.emit("stop_typing", { room }), 1500);
}

async function sendFile(file) {
    if (!file) return;
    const viewOnce = file.type.startsWith("image/") && confirm("Send as View Once photo? (disappears after opening)\n\nOK = View Once\nCancel = Normal photo");

    const formData = new FormData();
    formData.append("file", file);
    const res = await fetch(`/upload/${room}`, { method: "POST", body: formData });
    const data = await res.json();

    let type = "file";
    if (file.type.startsWith("image/")) type = "image";
    else if (file.type.startsWith("video/")) type = "video";
    else if (file.type.startsWith("audio/")) type = "audio";

    socket.emit("send_message", {
        room, receiver_id: otherId, type, content: data.url,
        filename: data.filename, view_once: viewOnce ? 1 : 0
    });
    document.getElementById("fileInput").value = "";
}

let mediaRecorder, audioChunks = [], isRecording = false;
async function toggleRecording() {
    const micBtn = document.getElementById("micBtn");
    if (!isRecording) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: "audio/webm" });
                await sendFile(new File([blob], "voice_note.webm", { type: "audio/webm" }));
            };
            mediaRecorder.start();
            isRecording = true;
            micBtn.textContent = "⏹️";
            micBtn.classList.add("recording");
        } catch (err) {
            alert("Microphone access denied: " + err.message);
        }
    } else {
        mediaRecorder.stop();
        isRecording = false;
        micBtn.textContent = "🎤";
        micBtn.classList.remove("recording");
    }
}

window.scrollTo(0, document.body.scrollHeight);
</script>

</body>
</html>
