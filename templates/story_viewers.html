<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viewers</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="dash-header">
    <h2>Story Viewers</h2>
    <div class="actions"><a href="/">Back</a></div>
</div>

<div class="dash-body">
    {% for v in viewers %}
    <div class="contact-item">
        <div class="avatar">{{ v['name'][0]|upper }}</div>
        <div><div class="name">{{ v['name'] }}</div><div class="status">{{ v['id'] }}</div></div>
    </div>
    {% else %}
    <p style="color:#888; text-align:center; margin-top:30px; font-size:14px;">No one has viewed this yet.</p>
    {% endfor %}
</div>

</body>
</html>
