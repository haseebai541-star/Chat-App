<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Chat App</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p class="sub">You'll get a unique Chat ID to share with others.</p>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

        <form method="POST">
            <div class="field">
                <label>Full Name</label>
                <input type="text" name="name" required>
            </div>
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <button class="btn-primary" type="submit">Sign Up</button>
        </form>

        <div class="switch-link">Already have an account? <a href="/login">Log In</a></div>
    </div>
</div>
</body>
</html>
