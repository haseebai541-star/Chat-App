<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Forgot Password</h1>
        <p class="sub">Enter your account email. We'll send a reset link.</p>

        {% if error %}<div class="error-box">{{ error }}</div>{% endif %}
        {% if success %}<div class="success-box">{{ success }}</div>{% endif %}

        <form method="POST">
            <div class="field">
                <label>Email</label>
                <input type="email" name="email" required>
            </div>
            <button class="btn-primary" type="submit">Send Reset Link</button>
        </form>

        <div class="switch-link"><a href="/login">Back to Log In</a></div>
    </div>
</div>
</body>
</html>
